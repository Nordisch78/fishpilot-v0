<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FishPilot · Oberried V0.12</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.header{position:absolute;z-index:1000;top:12px;left:12px;background:#fffffff0;padding:10px 13px;border-radius:14px;box-shadow:0 3px 15px #0002;max-width:390px}
.header b{font-size:19px}.header div{font-size:11px;color:#53616a;margin-top:3px}
.leaflet-control-layers{margin-top:92px!important}.fp{background:rgba(255,255,255,.94);border:1.5px solid #18313d;border-radius:50%;width:23px!important;height:23px!important;text-align:center;line-height:20px;font-weight:750;font-size:10px;box-shadow:0 1px 4px #0004}
.legend{position:absolute;z-index:999;right:12px;bottom:24px;background:rgba(255,255,255,.92);
padding:8px 10px;border-radius:10px;box-shadow:0 2px 10px #0002;font-size:11px;line-height:1.55}
.sw{display:inline-block;width:20px;height:8px;margin-right:6px;vertical-align:middle;border-radius:2px}
.sw-p{background:rgba(120,168,184,.28);border:1px solid #466b79}
.sw-e{background:rgba(73,111,125,.34);border:1px solid #253f49}
.sw-l{height:0;border-top:2px dashed #344e59;border-radius:0}

/* FishPilot V0.12 – mobile structure filter */
#fpFilterBtn{
  position:absolute; top:88px; left:14px; z-index:1200;
  border:0; border-radius:12px; padding:10px 14px; font-weight:700;
  background:rgba(255,255,255,.95); box-shadow:0 2px 10px rgba(0,0,0,.18);
}
#fpFilterPanel{
  position:absolute; top:134px; left:14px; z-index:1200; width:min(390px,calc(100vw - 28px));
  background:rgba(255,255,255,.97); border-radius:16px; padding:14px;
  box-shadow:0 4px 18px rgba(0,0,0,.22); font-family:system-ui,-apple-system,sans-serif;
}
#fpFilterPanel[hidden]{display:none}
.fp-title{font-size:17px;font-weight:800;margin:0 0 8px}
.fp-label{font-size:12px;font-weight:700;color:#555;margin:10px 0 6px}
.fp-chips{display:flex;gap:6px;flex-wrap:wrap}
.fp-chip{border:1px solid #b9c4c9;background:#fff;border-radius:999px;padding:7px 10px;font-weight:650}
.fp-chip.active{background:#123f4a;color:#fff;border-color:#123f4a}
#fpCount{margin-top:10px;font-size:12px;color:#555}
.fp-hidden{display:none!important}
@media(max-width:700px){
 #fpFilterBtn{top:104px}
 #fpFilterPanel{top:150px}
}

</style>
<style>
.fp-navbox{position:absolute;left:12px;bottom:18px;z-index:1000;background:rgba(255,255,255,.94);
border-radius:14px;padding:10px 12px;box-shadow:0 2px 12px rgba(0,0,0,.20);font:14px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
max-width:min(360px,calc(100vw - 24px))}
.fp-navrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.fp-btn{border:0;border-radius:10px;padding:9px 11px;font-weight:700;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.18);cursor:pointer}
.fp-btn-primary{background:#173f4d;color:white}
.fp-btn-stop{background:#f3f3f3}
.fp-navstat{margin-top:7px;font-weight:650}
.fp-small{font-size:12px;font-weight:500;opacity:.78;margin-top:3px}
.fp-target-marker{background:#fff;border:3px solid #173f4d;border-radius:50%;width:17px;height:17px;box-shadow:0 1px 5px rgba(0,0,0,.35)}
@media(max-width:650px){
 .leaflet-control-layers{font-size:12px}
 .fp-navbox{bottom:14px}
}
</style>

</head><body>

<button id="fpFilterBtn" type="button">Strukturen filtern</button>
<div id="fpFilterPanel" hidden>
  <div class="fp-title">Strukturfilter</div>
  <div class="fp-label">Strukturtyp</div>
  <div class="fp-chips" id="fpTypeChips">
    <button class="fp-chip active" data-type="Alle">Alle</button>
    <button class="fp-chip" data-type="Kante">Kanten</button>
    <button class="fp-chip" data-type="Nase">Nasen</button>
    <button class="fp-chip" data-type="Rinne">Rinnen</button>
    <button class="fp-chip" data-type="Plateau">Plateaus</button>
    <button class="fp-chip" data-type="Sattel">Sättel</button>
  </div>
  <div class="fp-label">Tiefe</div>
  <div class="fp-chips" id="fpDepthChips">
    <button class="fp-chip active" data-depth="all">Alle</button>
    <button class="fp-chip" data-depth="0,10">0–10 m</button>
    <button class="fp-chip" data-depth="10,20">10–20 m</button>
    <button class="fp-chip" data-depth="20,40">20–40 m</button>
    <button class="fp-chip" data-depth="40,80">40–80 m</button>
    <button class="fp-chip" data-depth="80,9999">&gt;80 m</button>
  </div>
  <div id="fpCount">Filter bereit</div>
</div>
<div id="map"></div>
<div class="header"><b>FishPilot · Oberried</b><div>V0.12 · Structure Intelligence – Filter, Strukturtypen & GPS</div></div>
<div class="legend"><b>Struktur #11</b><br>
<span class="sw sw-p"></span>Plateau-Teilbereiche<br>
<span class="sw sw-e"></span>Oberkante ~25 m<br>
<span class="sw sw-l"></span>Unterkante ~50 m
</div>
<div id="fp-nav" class="fp-navbox">
  <div class="fp-navrow">
    <button id="fp-locate" class="fp-btn">Meine Position</button>
    <button id="fp-navigate" class="fp-btn fp-btn-primary" disabled>Zur Struktur</button>
    <button id="fp-stop" class="fp-btn fp-btn-stop" style="display:none">Stop</button>
  </div>
  <div id="fp-navstat" class="fp-navstat">Angelstruktur anklicken und „Zur Struktur“ wählen.</div>
  <div id="fp-accuracy" class="fp-small"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([46.7315,7.966],14);
L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(map);
const overlays={};

Promise.all([
 fetch('bathymetry.geojson').then(r=>r.json()),
 fetch('fishpilot_structures.geojson').then(r=>r.json()).catch(()=>null),
 fetch('fishpilot_structure11_v07.geojson').then(r=>r.json()),
 fetch('fishpilot_catalog_v09.geojson').then(r=>r.json()),
 fetch('fishpilot_fishing_targets_v011.geojson').then(r=>r.json())
]).then(([bathy,pts,detail,terrain,fishingTargets])=>{
 overlays['Tiefenlinien']=L.geoJSON(bathy,{style:f=>{
 const d=Number(f.properties.depth_m||0);
 return {color:'#247b99',weight:(d%50===0?1.8:1.05),opacity:(d%50===0?.88:.70)};
},onEachFeature:(f,l)=>{
 if(f.properties.depth_m) l.bindTooltip(f.properties.depth_m+' m',{sticky:true,direction:'top'});
}}).addTo(map);
 if(pts) overlays['Strukturpunkte V0.4']=L.geoJSON(pts,{
  filter:f=>Number(f.properties.id)!==11,
  pointToLayer:(f,ll)=>L.marker(ll,{icon:L.divIcon({className:'fp',html:f.properties.id,iconSize:[23,23],iconAnchor:[11,11]})}),
  onEachFeature:(f,l)=>{
    const p=f.properties;
    l.bindPopup(`<b>${p.type} #${p.id}</b><br>
      <b>Tiefe:</b> ${p.depth_min}–${p.depth_max} m<br>
      <b>Ausdehnung:</b> ca. ${p.length_m} m<br>
      <b>Fläche:</b> ${Number(p.area_m2).toLocaleString('de-CH')} m²<br>
      <b>Median Gefälle:</b> ${p.slope_median}°<br>
      <b>steile Bereiche (P90):</b> ${p.slope_p90}°<br>
      <b>Terrain-Score:</b> ${p.terrain_score}/100<br>
      <small>Terrain-Score bewertet nur die Geländeausprägung, nicht die Fangchance.</small>`);
  }
}).addTo(map);
 overlays['#11 Detail V0.7.1']=L.geoJSON(detail,{
  style:f=>{
   if(f.properties.kind==='plateau_segment') return {
     color:'#557681',weight:1.1,opacity:.62,fillColor:'#7faab7',fillOpacity:.08
   };
   if(f.properties.kind==='upper_break') return {
     color:'#203b46',weight:3.2,opacity:.95
   };
   if(f.properties.kind==='lower_break') return {
     color:'#526d77',weight:2.4,opacity:.9,dashArray:'7,5'
   };
   return {color:'#344e59',weight:2,opacity:.8};
  },
  onEachFeature:(f,l)=>{
   const p=f.properties;
   if(p.kind==='plateau_segment') l.bindPopup(`<b>${p.name}</b><br><b>Typ:</b> Plateau-Teilbereich<br><b>Tiefenbereich:</b> ${p.depth_min}–${p.depth_max} m<br><b>Fläche:</b> ${Number(p.area_m2).toLocaleString('de-CH')} m²<br><small>Teilbereich der automatisch erkannten Struktur #11.</small>`);
   if(p.kind==='upper_break') l.bindPopup(`<b>${p.name}</b><br><b>Referenztiefe:</b> ca. ${p.depth_m} m<br><b>Verlauf:</b> ${p.length_m} m<br><b>Funktion:</b> Übergang Plateau → Steilhang<br><small>Noch feste Referenztiefe; V0.8 soll den Hangbeginn automatisch erkennen.</small>`);
   if(p.kind==='lower_break') l.bindPopup(`<b>${p.name}</b><br><b>Referenztiefe:</b> ca. ${p.depth_m} m<br><b>Verlauf:</b> ${p.length_m} m<br><b>Funktion:</b> Übergang Steilhang → tieferer Seegrund<br><small>Noch feste Referenztiefe; V0.8 soll das Hangende automatisch erkennen.</small>`);
  }
 }).addTo(map);
 
 if(terrain) overlays['Strukturkatalog V0.9']=L.geoJSON(terrain,{
  style:f=>f.properties.kind==='auto_slope'
   ? {color:'#314f59',weight:1.5,opacity:.88,fillColor:'#668895',fillOpacity:.14}
   : {color:'#5c727a',weight:1.7,opacity:.85,dashArray:'5,5',fillOpacity:.03},
  onEachFeature:(f,l)=>{
   const p=f.properties;
   if(p.kind==='auto_slope') l.bindPopup(`<b>${p.structure_id} · ${p.structure_type}</b><br><b>${p.catalog_name}</b><br><b>Tiefe oben–unten:</b> ${p.depth_shallow_m}–${p.depth_deep_m} m<br><b>Median:</b> ${p.depth_median_m} m<br><b>Relief:</b> ${p.relief_m} m<br><b>Gefälle Median / P90:</b> ${p.slope_median_deg}° / ${p.slope_p90_deg}°<br><b>Fläche:</b> ${Number(p.area_m2).toLocaleString('de-CH')} m²<br><small>Automatisch aus der Geländeform erkannt – ohne feste Tiefenkante.</small>`);
   else l.bindPopup(`<b>${p.name}</b><br><b>mittlere Tiefe:</b> ${p.depth_median_m} m<br><b>mittleres Gefälle:</b> ${p.slope_median_deg}°<br><small>Zone mit ausgeprägter Änderung des Gefälles.</small>`);
  }
 }).addTo(map);

 
 if(fishingTargets){
   const icons={
    'Nase / Vorsprung':'▲',
    'Rinne / Einbuchtung':'▼',
    'Steilkante':'◆',
    'Plateau / Terrasse':'●'
   };
   overlays['Angelstrukturen V0.12']=L.geoJSON(fishingTargets,{
     pointToLayer:(f,ll)=>L.marker(ll,{icon:L.divIcon({
       className:'',
       html:`<div style="width:28px;height:28px;border-radius:50%;background:white;border:2px solid #173f4d;box-shadow:0 1px 5px #555;display:flex;align-items:center;justify-content:center;font-weight:800;color:#173f4d">${icons[f.properties.structure_type]||'•'}</div>`,
       iconSize:[28,28],iconAnchor:[14,14]
     })}),
     onEachFeature:(f,l)=>{
       const p=f.properties;
       l.bindPopup(`<b>${p.structure_id} · ${p.structure_type}</b><br>${p.catalog_name}<br><b>Tiefe:</b> ${p.depth_m} m<br><b>Gefälle:</b> ${p.slope_deg}°<br><b>Lokaler Reliefindex:</b> ${p.local_relief_index_m} m<br><small>V0.12 automatisch aus der lokalen Geländeform erkannt.</small>`);
       l.on('click',()=>fpSetTarget(l,p));
     }
   }).addTo(map);
 }

 L.control.layers({'OpenStreetMap':osm},overlays,{collapsed:false}).addTo(map);
});

// ---- FishPilot V0.10 GPS navigation ----
let fpSelected = null, fpTarget = null, fpTargetMarker = null, fpRoute = null;
let fpWatch = null, fpUserMarker = null, fpAccuracyCircle = null, fpLastPos = null;

const fpStat = document.getElementById('fp-navstat');
const fpAcc = document.getElementById('fp-accuracy');
const fpNavBtn = document.getElementById('fp-navigate');
const fpStopBtn = document.getElementById('fp-stop');

function fpRad(x){return x*Math.PI/180}
function fpDeg(x){return x*180/Math.PI}
function fpDistance(a,b){
 const R=6371000, p1=fpRad(a.lat), p2=fpRad(b.lat), dp=fpRad(b.lat-a.lat), dl=fpRad(b.lng-a.lng);
 const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return 2*R*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}
function fpBearing(a,b){
 const p1=fpRad(a.lat),p2=fpRad(b.lat),dl=fpRad(b.lng-a.lng);
 const y=Math.sin(dl)*Math.cos(p2), x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
 return (fpDeg(Math.atan2(y,x))+360)%360;
}
function fpCompass(d){
 const n=['N','NO','O','SO','S','SW','W','NW']; return n[Math.round(d/45)%8];
}
function fpCentroid(layer){
 try {
   if(layer.getBounds){ const c=layer.getBounds().getCenter(); return {lat:c.lat,lng:c.lng}; }
   if(layer.getLatLng){ const c=layer.getLatLng(); return {lat:c.lat,lng:c.lng}; }
 } catch(e){}
 return null;
}
function fpSetTarget(layer, props){
 const c=fpCentroid(layer); if(!c) return;
 fpSelected={layer,props:props||{},center:c}; fpTarget=c;
 fpNavBtn.disabled=false;
 const id=(props&&props.structure_id)||'Struktur';
 fpStat.textContent=id+' ausgewählt · Navigation bereit';
}
function fpUpdate(pos){
 const p={lat:pos.coords.latitude,lng:pos.coords.longitude}; fpLastPos=p;
 const acc=Math.round(pos.coords.accuracy||0);
 if(!fpUserMarker){
   fpUserMarker=L.circleMarker([p.lat,p.lng],{radius:8,weight:3,color:'#1769aa',fillColor:'#fff',fillOpacity:1}).addTo(map).bindTooltip('Meine Position');
   fpAccuracyCircle=L.circle([p.lat,p.lng],{radius:acc,weight:1,color:'#1769aa',fillOpacity:.06}).addTo(map);
 } else {
   fpUserMarker.setLatLng([p.lat,p.lng]); fpAccuracyCircle.setLatLng([p.lat,p.lng]).setRadius(acc);
 }
 fpAcc.textContent='GPS-Genauigkeit: ±'+acc+' m';
 if(fpTarget){
   const d=fpDistance(p,fpTarget), b=fpBearing(p,fpTarget), id=(fpSelected?.props?.structure_id)||'Ziel';
   fpStat.textContent=id+' · '+(d<1000?Math.round(d)+' m':(d/1000).toFixed(2)+' km')+' · '+Math.round(b)+'° '+fpCompass(b);
   if(fpRoute) fpRoute.setLatLngs([[p.lat,p.lng],[fpTarget.lat,fpTarget.lng]]);
 }
}
function fpError(err){
 fpStat.textContent='Position nicht verfügbar.';
 fpAcc.textContent=err && err.message ? err.message : 'Bitte Standortfreigabe in Safari prüfen.';
}
function fpStartWatch(centerOnce=false){
 if(!navigator.geolocation){fpStat.textContent='Geolocation wird von diesem Browser nicht unterstützt.';return;}
 if(fpWatch!==null) navigator.geolocation.clearWatch(fpWatch);
 fpWatch=navigator.geolocation.watchPosition(p=>{
   fpUpdate(p);
   if(centerOnce){map.setView([p.coords.latitude,p.coords.longitude],Math.max(map.getZoom(),16));centerOnce=false;}
 },fpError,{enableHighAccuracy:true,maximumAge:1000,timeout:12000});
}
document.getElementById('fp-locate').onclick=()=>{
 fpStat.textContent='GPS wird angefragt …';
 fpAcc.textContent='Falls iOS fragt: Standortzugriff erlauben.';
 fpStartWatch(true);
};
fpNavBtn.onclick=()=>{
 if(!fpTarget){return;}
 if(fpTargetMarker) map.removeLayer(fpTargetMarker);
 fpTargetMarker=L.marker([fpTarget.lat,fpTarget.lng],{
   icon:L.divIcon({className:'',html:'<div class="fp-target-marker"></div>',iconSize:[17,17],iconAnchor:[8,8]})
 }).addTo(map).bindTooltip('Navigationsziel',{permanent:false});
 if(fpRoute) map.removeLayer(fpRoute);
 fpRoute=L.polyline([], {weight:3,dashArray:'8,7',color:'#173f4d'}).addTo(map);
 fpStopBtn.style.display='';
 fpStartWatch(false);
 if(fpLastPos) fpUpdate({coords:{latitude:fpLastPos.lat,longitude:fpLastPos.lng,accuracy:fpAccuracyCircle?fpAccuracyCircle.getRadius():0}});
};
fpStopBtn.onclick=()=>{
 if(fpWatch!==null){navigator.geolocation.clearWatch(fpWatch);fpWatch=null;}
 if(fpRoute){map.removeLayer(fpRoute);fpRoute=null;}
 if(fpTargetMarker){map.removeLayer(fpTargetMarker);fpTargetMarker=null;}
 fpStopBtn.style.display='none';
 fpStat.textContent=fpSelected ? ((fpSelected.props.structure_id||'Struktur')+' ausgewählt · Navigation bereit') : 'Angelstruktur anklicken und „Zur Struktur“ wählen.';
};

// Hook structure layers after they are created.
// Leaflet click bubbles through the map; identify the clicked vector layer via eachLayer registrations.
map.eachLayer(function(l){
 if(l && l.feature && l.feature.properties && l.feature.properties.structure_id){
   l.on('click',()=>fpSetTarget(l,l.feature.properties));
 }
});
map.on('layeradd',function(e){
 const l=e.layer;
 if(l && l.eachLayer){
   try{l.eachLayer(function(x){
     if(x && x.feature && x.feature.properties && x.feature.properties.structure_id && !x._fpNavBound){
       x._fpNavBound=true; x.on('click',()=>fpSetTarget(x,x.feature.properties));
     }
   });}catch(err){}
 }
});

</script>

<script>
(function(){
  let selectedType='Alle', depth='all';
  const btn=document.getElementById('fpFilterBtn'), panel=document.getElementById('fpFilterPanel');
  btn.addEventListener('click',()=>panel.hidden=!panel.hidden);

  function layerText(l){
    let s='';
    if(l && l.feature && l.feature.properties) s += ' '+JSON.stringify(l.feature.properties);
    if(l && l.getPopup && l.getPopup() && l.getPopup().getContent) s += ' '+String(l.getPopup().getContent());
    return s.toLowerCase();
  }
  function typeOK(s){
    if(selectedType==='Alle') return true;
    const keys={
      Kante:['kante','steilabbruch','hangstufe'],
      Nase:['nase','vorsprung'],
      Rinne:['rinne','einbuchtung'],
      Plateau:['plateau','terrasse'],
      Sattel:['sattel','übergang','uebergang']
    };
    return (keys[selectedType]||[]).some(k=>s.includes(k));
  }
  function depthValue(l,s){
    const p=l && l.feature && l.feature.properties ? l.feature.properties : {};
    for(const k of ['depth','tiefe','depth_m','median_depth','median_tiefe']){
      const v=parseFloat(p[k]); if(Number.isFinite(v)) return Math.abs(v);
    }
    let m=s.match(/tiefe[^0-9]{0,20}([0-9]+(?:[.,][0-9]+)?)/i);
    return m ? parseFloat(m[1].replace(',','.')) : null;
  }
  function apply(){
    let seen=0, shown=0;
    if(!window.map || !map.eachLayer){ document.getElementById('fpCount').textContent='Karte lädt …'; return; }
    map.eachLayer(function(l){
      const s=layerText(l);
      if(!s || !(s.includes('obr-') || s.includes('struktur') || s.includes('kante') || s.includes('nase') || s.includes('rinne') || s.includes('plateau') || s.includes('sattel'))) return;
      if(!l._fpOriginalOpacity){
        l._fpOriginalOpacity = l.options && l.options.opacity != null ? l.options.opacity : 1;
        l._fpOriginalFillOpacity = l.options && l.options.fillOpacity != null ? l.options.fillOpacity : .2;
      }
      seen++;
      let ok=typeOK(s);
      if(depth!=='all'){
        const [a,b]=depth.split(',').map(Number), d=depthValue(l,s);
        if(d!==null) ok = ok && d>=a && d<b;
      }
      if(l.setStyle){
        l.setStyle({opacity:ok?l._fpOriginalOpacity:0, fillOpacity:ok?l._fpOriginalFillOpacity:0});
        if(l.getElement) { const e=l.getElement(); if(e) e.style.pointerEvents=ok?'':'none'; }
      } else if(l.setOpacity) l.setOpacity(ok?1:0);
      if(ok) shown++;
    });
    document.getElementById('fpCount').textContent = shown+' von '+seen+' erkannten Kartenobjekten sichtbar';
  }
  document.querySelectorAll('#fpTypeChips .fp-chip').forEach(x=>x.onclick=function(){
    document.querySelectorAll('#fpTypeChips .fp-chip').forEach(y=>y.classList.remove('active'));
    this.classList.add('active'); selectedType=this.dataset.type; apply();
  });
  document.querySelectorAll('#fpDepthChips .fp-chip').forEach(x=>x.onclick=function(){
    document.querySelectorAll('#fpDepthChips .fp-chip').forEach(y=>y.classList.remove('active'));
    this.classList.add('active'); depth=this.dataset.depth; apply();
  });
  setTimeout(apply,1600);
})();
</script>

</body></html>
