<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FishPilot · Oberried V0.5</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.header{position:absolute;z-index:1000;top:12px;left:12px;background:#fffffff0;padding:10px 13px;border-radius:14px;box-shadow:0 3px 15px #0002;max-width:390px}
.header b{font-size:19px}.header div{font-size:11px;color:#53616a;margin-top:3px}
.leaflet-control-layers{margin-top:92px!important}.fp{background:white;border:2px solid #18313d;border-radius:50%;width:27px!important;height:27px!important;text-align:center;line-height:23px;font-weight:800;box-shadow:0 2px 6px #0005}
</style></head><body><div id="map"></div>
<div class="header"><b>FishPilot · Oberried</b><div>V0.5 · Structure Engine – Fläche, Kanten und Tiefenprofil</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([46.7315,7.966],14);
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(map);
const overlays={};

Promise.all([
 fetch('bathymetry.geojson').then(r=>r.json()),
 fetch('fishpilot_structures.geojson').then(r=>r.json()).catch(()=>null),
 fetch('fishpilot_structure11_v05.geojson').then(r=>r.json())
]).then(([bathy,pts,detail])=>{
 overlays['Tiefenlinien']=L.geoJSON(bathy,{style:f=>({color:'#287d9b',weight:1.2,opacity:.72})}).addTo(map);
 if(pts) overlays['Strukturpunkte V0.4']=L.geoJSON(pts,{pointToLayer:(f,ll)=>L.marker(ll,{icon:L.divIcon({className:'fp',html:f.properties.id,iconSize:[27,27],iconAnchor:[13,13]})})}).addTo(map);
 overlays['Struktur #11 Detail']=L.geoJSON(detail,{
  style:f=>{
   if(f.properties.kind==='plateau') return {color:'#172f3a',weight:2,fillOpacity:.18};
   if(f.properties.kind==='edge') return {color:'#111',weight:2.8,fillOpacity:.28};
   return {color:'#111',weight:3,dashArray:'7,6',fillOpacity:0};
  },
  onEachFeature:(f,l)=>{
   const p=f.properties;
   if(p.kind==='plateau') l.bindPopup(`<b>${p.name}</b><br>Tiefe ${p.depth_min}–${p.depth_max} m<br>Fläche ${Number(p.area_m2).toLocaleString('de-CH')} m²`);
   if(p.kind==='edge') l.bindPopup(`<b>${p.name}</b><br>Tiefe ${p.depth_min}–${p.depth_max} m<br>Median Gefälle ${p.slope_median}°<br>P90 ${p.slope_p90}°`);
   if(p.kind==='profile') l.bindPopup(`<b>${p.name}</b><br>${p.length_m} m Messlinie<br>Tiefe ${p.depth_start} → ${p.depth_end} m`);
  }
 }).addTo(map);
 L.control.layers({'OpenStreetMap':osm},overlays,{collapsed:false}).addTo(map);
});
</script></body></html>
